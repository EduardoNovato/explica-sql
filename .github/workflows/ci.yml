# En cada cambio: tipos, pruebas, build para Vercel y la velocidad del motor (con su tabla en el resumen)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run check
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build
      - name: Velocidad del motor
        run: npm run bench
        env:
          # Los runners son más lentos que un portátil: falla solo si la mediana pasa del doble de la meta
          BENCH_TOLERANCE: 2
